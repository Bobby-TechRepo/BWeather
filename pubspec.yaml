name: bweather
description: "BWeather: forecasts for your location and saved cities, powered by Open-Meteo."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.13.4
  # material_ui / cupertino_ui need Flutter 3.47 or newer.
  flutter: ">=3.47.0"

# One `flutter pub get` here resolves the app and its local packages together
# (Dart pub workspaces), so no package can be left with stale dependencies.
workspace:
  - packages/bweather_open_meteo_api
  - packages/bweather_repository
  - plugins/liquid_pull_refresh

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.9
  # Material and Cupertino widgets now ship as packages (the SDK copies are
  # deprecated from Flutter 3.50). 1.3.0 / 1.1.0 were retracted, so start above them.
  material_ui: ^1.4.0
  cupertino_ui: ^1.1.1
  connectivity_plus: ^7.3.1
  equatable: ^2.1.0
  flutter_bloc: ^9.1.1
  flutter_local_notifications: ^23.0.1
  flutter_map: ^8.3.2
  flutter_svg: ^2.3.0
  geolocator: ^14.0.3
  google_fonts: ^8.2.1
  home_widget: ^0.10.0
  hydrated_bloc: ^11.0.0
  intl: any # version is pinned by flutter_localizations
  latlong2: ^0.9.1
  lottie: ^3.6.1
  package_info_plus: ^10.2.1
  path_provider: ^2.1.6
  responsive_framework: ^1.5.1
  sentry_flutter: ^10.3.0
  share_plus: ">=11.0.0 <14.0.0" # SharePlus.instance.share(ShareParams(...)) API
  shimmer: ^4.0.0
  url_launcher: ^6.3.1
  workmanager: ^0.10.10

  bweather_repository:
    path: packages/bweather_repository
  liquid_pull_refresh:
    path: plugins/liquid_pull_refresh

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  bloc_test: ^10.0.0

flutter:
  # Generates lib/l10n/app_localizations*.dart from lib/l10n/*.arb (see l10n.yaml).
  generate: true
  uses-material-design: true

  assets:
    - files/
    - files/icons/
    - files/animations/
