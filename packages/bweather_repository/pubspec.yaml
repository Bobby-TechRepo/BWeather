name: bweather_repository
description: "BWeather repository: maps the Open-Meteo client into app domain models."
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.13.4
  flutter: ">=1.17.0"

# Resolved together with the app (see the workspace list in the root pubspec.yaml).
resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  equatable: ^2.1.0
  http: ^1.6.0
  bweather_open_meteo_api:
    path: ../bweather_open_meteo_api

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  coverage: ^1.15.1
