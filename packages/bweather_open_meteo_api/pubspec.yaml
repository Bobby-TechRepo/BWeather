name: bweather_open_meteo_api
description: "Dart client for the Open-Meteo forecast and geocoding APIs."
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.13.4
  flutter: ">=1.17.0"

# Resolved together with the app (see the workspace list in the root pubspec.yaml).
resolution: workspace

dependencies:
  equatable: ^2.1.0
  flutter:
    sdk: flutter
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
